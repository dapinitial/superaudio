name: Validate profiles

# Runs once this directory is its own repo (workflows only execute at a repo
# root). Validates every device profile against schema.json on PR and on push
# to main — the gate every community contribution (and every Skill-drafted
# profile) passes before merge.

on:
  pull_request:
    paths:
      - 'profiles/**'
      - 'schema.json'
      - 'scripts/validate.py'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate all profiles against schema.json
        run: python3 scripts/validate.py
